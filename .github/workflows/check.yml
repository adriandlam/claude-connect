name: check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # Claude Code's hooks API moves between releases, so check even with no commits

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun relay/check.ts
      # Pinned, except the weekly run, which is there to catch engine changes.
      - run: npm install -g @anthropic-ai/claude-code@${{ github.event_name == 'schedule' && 'latest' || '2.1.319' }}
      - run: claude plugin validate .
      - run: claude plugin validate rows
      - run: claude plugin test .
      - run: claude plugin test rows
